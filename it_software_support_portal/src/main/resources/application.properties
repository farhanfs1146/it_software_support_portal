spring.application.name=it_software_support_portal

# set port of server
server.port = 9092

# Database connection. Credentials come from the environment so nothing secret is committed;
# the defaults are local-development values only and must be overridden elsewhere.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ITSoftwareSupport}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate schema
spring.datasource.hikari.schema=it_software_support_db

# Flyway schema (CRITICAL)
spring.flyway.schemas=it_software_support_db
spring.flyway.default-schema=it_software_support_db

# Flyway migration path
spring.flyway.locations=classpath:db/migration

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ---------------------------------------------------------------------------
# Security (Phase 4). See docs/SECURITY.md.
# ---------------------------------------------------------------------------

# HMAC signing key for access tokens. MUST be set in any shared or production environment, and must
# be at least 32 bytes. Left empty here on purpose: committing a signing secret would mean anyone
# with the repository could mint valid tokens. When empty the application generates a random key at
# startup and warns - secure, but tokens do not survive a restart or work across instances.
app.security.jwt.secret=${APP_JWT_SECRET:}
app.security.jwt.issuer=it-software-support-portal
app.security.jwt.ttl=30m

# Browser origins allowed to call the API. Exact origins only - never a wildcard.
app.security.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:4200}
# The API authenticates with bearer tokens, not cookies, so credentialed CORS is not required.
app.security.cors.allow-credentials=false

# Swagger/OpenAPI is reachable without a token for development and demos. Set to false in
# production, where the schema of every endpoint is information an attacker does not need.
app.security.swagger-public=${APP_SWAGGER_PUBLIC:true}

# Creates one ADMIN on first start, only if no administrator exists and both values are supplied.
# Supply these through the environment; never commit a real password.
app.security.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.security.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.security.bootstrap-admin.full-name=${APP_BOOTSTRAP_ADMIN_NAME:Bootstrap Administrator}

# Login abuse protection (Phase 5). Applies only to POST /api/auth/login; authenticated API traffic is
# unaffected. Thresholds and reasoning: docs/SECURITY.md. In-process only - see the distributed note.
app.security.rate-limit.enabled=${APP_RATE_LIMIT_ENABLED:true}
app.security.rate-limit.max-account-failures=5
app.security.rate-limit.max-address-failures=20
app.security.rate-limit.window=15m
app.security.rate-limit.block-duration=15m
app.security.rate-limit.max-tracked-keys=50000
# Only enable behind a reverse proxy that APPENDS the real peer to X-Forwarded-For. Left false because
# no trusted proxy is configured: trusting the header without one lets any client forge its own address
# and defeat per-address throttling entirely.
app.security.rate-limit.trust-forwarded-headers=${APP_TRUST_FORWARDED_HEADERS:false}

# ---------------------------------------------------------------------------
# Session lifecycle (Phase 7). See docs/SECURITY.md.
# ---------------------------------------------------------------------------

# Key id written into the kid header of newly issued access tokens. Needed only when rotating the
# signing secret - see security/JwtKeys for the procedure. During a rotation, move the OLD secret and
# its id into previous-keys so tokens signed with it keep verifying until they expire, then delete the
# entry. Example:
#   app.security.jwt.key-id=2026-10
#   app.security.jwt.previous-keys[0].key-id=2026-04
#   app.security.jwt.previous-keys[0].secret=${APP_JWT_SECRET_PREVIOUS:}
app.security.jwt.key-id=${APP_JWT_KEY_ID:primary}

# How long a refresh token can be exchanged. Longer than the access token on purpose: the access token
# is short so a stolen one expires quickly, and the refresh token is what spares the user from
# re-entering their password every half hour. It is single-use and rotated on every refresh.
app.security.session.refresh-ttl=${APP_REFRESH_TTL:7d}

# How long account state (token version, active flag) may be cached while validating access tokens.
# A revocation performed BY THIS INSTANCE is immediate at any value, because the revoking code
# invalidates the cache entry. This bounds only changes made elsewhere: a direct database edit, or
# another instance behind a load balancer.
# SET THIS TO 0 FOR A MULTI-INSTANCE DEPLOYMENT. Zero disables caching entirely, making revocation
# immediate everywhere at the cost of one small indexed select per authenticated request.
app.security.session.state-cache-ttl=${APP_SESSION_STATE_CACHE_TTL:15s}
app.security.session.state-cache-max-entries=10000

# How long an expired refresh-token row is kept before the purge job deletes it. Retention exists so a
# detected token replay can still be investigated after the tokens involved have expired.
app.security.session.expired-retention=${APP_SESSION_EXPIRED_RETENTION:7d}

# Cap on simultaneous sessions per user; the oldest are revoked past it. 0 disables the cap.
app.security.session.max-sessions-per-user=${APP_MAX_SESSIONS_PER_USER:10}

# When expired refresh-token rows are deleted. Daily at 03:15 by default.
app.security.session.purge-cron=${APP_SESSION_PURGE_CRON:0 15 3 * * *}
